<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Axex Orbit</title>
<style>
  :root { --bg:#fff; --fg:#172033; --mut:#667085; --line:rgba(16,24,40,.14); --stage:#f3f6fb; --accent:#315efb; --accent-2:#6f8cff; --ok:#149a61; --bad:#d92d20; --warn:#b7791f; --hover:rgba(49,94,251,.58); --shadow:0 18px 50px rgba(16,24,40,.14); }
  [data-theme="dark"] { --bg:#171a23; --fg:#f5f7ff; --mut:#a6afc3; --line:rgba(255,255,255,.16); --stage:#232938; --accent:#86a0ff; --accent-2:#5475f5; --ok:#35d58a; --bad:#ff6b61; --warn:#f4c95d; --hover:rgba(134,160,255,.72); --shadow:0 18px 50px rgba(0,0,0,.4); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }

  /* ---------- inline responsive widget ---------- */
  #box { display: flex; align-items: center; gap: 12px; height: 100%; padding: 0 15px; border-radius: 16px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line), 0 2px 5px rgba(16,24,40,.06); cursor: pointer; user-select: none; outline: none; transition: box-shadow .2s, transform .2s, background .2s; }
  #box:hover { box-shadow: inset 0 0 0 1px var(--hover), 0 4px 12px rgba(16,24,40,.1); transform: translateY(-1px); }
  #box:focus-visible { box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  #box:active { transform: translateY(0); }
  #check { width: 28px; height: 28px; border: 2px solid #98a2b3; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--bg); transition: background .2s, border-color .2s, border-radius .2s, transform .2s; }
  #check svg { display: none; }
  #spin { display: none; width: 18px; height: 18px; border: 2.5px solid rgba(128,128,128,.28); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }
  #txt { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #label { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
  #sub { font-size: 11px; color: var(--mut); margin-top: 2px; }
  #sub:empty { display: none; }
  .brand { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; line-height: 1; flex: none; }
  .brand b { display: flex; align-items: center; gap: 4px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: -.01em; }
  .brand small { font-size: 8px; color: var(--mut); letter-spacing: .01em; }
  #box[data-state="loading"] #check { border-color: transparent; background: none; }
  #box[data-state="loading"] #spin { display: block; }
  #box[data-state="success"], #box[data-state="loading"] { cursor: default; }
  #box[data-state="success"] #check, #box[data-state="fail"] #check, #box[data-state="error"] #check { border-color: transparent; border-radius: 50%; }
  #box[data-state="success"] #check { background: var(--ok); animation: pop .38s ease; }
  #box[data-state="fail"] #check { background: var(--bad); }
  #box[data-state="error"] #check { background: var(--warn); }
  #box[data-state="success"] #tick, #box[data-state="fail"] #cross, #box[data-state="error"] #excl { display: block; }
  #box[data-state="fail"] #label { color: var(--bad); }

  /* ---------- popup challenge ---------- */
  body:not(.pop) #pop { display: none; }
  body.pop #box { display: none; }
  #pop { position: relative; height: 100%; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--bg); --c: var(--accent); }
  #pop[data-tone="green"] { --c: var(--ok); }
  #pop[data-tone="red"] { --c: var(--bad); }
  #ph { position: relative; flex: none; isolation: isolate; overflow: hidden; background: radial-gradient(circle at 90% -20%, rgba(255,255,255,.3), transparent 46%), linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0)), var(--c); color: #fff; padding: 22px 22px 19px; transition: background-color .25s; }
  #ph::after { content: ""; position: absolute; right: -34px; bottom: -52px; z-index: -1; width: 150px; height: 150px; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; box-shadow: 0 0 0 18px rgba(255,255,255,.04), 0 0 0 36px rgba(255,255,255,.035); pointer-events: none; }
  #instrSmall { font-size: 11px; font-weight: 750; letter-spacing: .09em; line-height: 1.2; min-height: 14px; text-transform: uppercase; opacity: .86; }
  #instr { max-width: 300px; font-size: 29px; font-weight: 750; line-height: 1.08; letter-spacing: -.035em; margin-top: 5px; }
  #close { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,.26); background: rgba(255,255,255,.16); color: #fff; font-size: 19px; line-height: 1; cursor: pointer; transition: background .2s, transform .2s; }
  #close:hover { background: rgba(255,255,255,.3); transform: scale(1.04); }
  #close:focus-visible { outline: 3px solid rgba(255,255,255,.8); outline-offset: 2px; }
  #pb { height: 5px; flex: none; background: rgba(0,0,0,.18); }
  #bar { height: 100%; width: 100%; background: #fff; opacity: .92; transition: width .12s linear; will-change: width; }
  #stage { position: relative; flex: none; margin: 16px 16px 12px; aspect-ratio: 4 / 3; border: 1px solid color-mix(in srgb, var(--accent) 20%, var(--line)); border-radius: 16px; background: var(--stage); box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 8px 22px rgba(16,24,40,.09); overflow: hidden; contain: paint; }
  #stage::after { content: ""; position: absolute; inset: 0; border: 1px solid rgba(255,255,255,.35); border-radius: inherit; pointer-events: none; }
  #stageMeta { position: absolute; top: 10px; right: 10px; z-index: 1; display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid rgba(49,94,251,.14); border-radius: 999px; background: color-mix(in srgb, var(--bg) 78%, transparent); color: var(--mut); font-size: 9px; font-weight: 800; letter-spacing: .08em; backdrop-filter: blur(8px); pointer-events: none; }
  #stageMeta i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); animation: live 1.5s ease-in-out infinite; transition: background .25s, box-shadow .25s; }
  #pop[data-phase="0"] #stageMeta i { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent); }
  #pop[data-phase="1"] #stageMeta i { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  @keyframes live { 50% { opacity: .45; transform: scale(.82); } }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; image-rendering: auto; }
  #vf { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(30,158,90,.1); }
  #vf svg { width: 96px; height: 96px; animation: pop .45s ease; }
  #pop[data-view="done"] #vf { display: flex; }
  #pf { display: flex; align-items: center; gap: 12px; padding: 13px 18px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); font-size: 12px; color: var(--mut); margin-top: auto; flex: none; }
  #help { background: none; border: 0; padding: 7px 9px; margin: -7px -9px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--mut); border-radius: 10px; transition: color .2s, background .2s; }
  #help:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  #helpText { font-size: 11px; font-weight: 650; white-space: nowrap; }
  #help:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #rounds { flex: 1; text-align: center; }
  @media (max-width: 520px) {
    #pop::before { content: ""; position: absolute; top: 8px; left: 50%; z-index: 2; width: 42px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.62); transform: translateX(-50%); pointer-events: none; }
    #ph { padding: 30px 18px 16px; }
    #instr { max-width: calc(100% - 38px); font-size: 27px; }
    #close { top: 14px; right: 12px; width: 42px; height: 42px; }
    #stage { margin: 14px 14px 10px; border-radius: 14px; }
    #pf { min-height: 64px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
    #help { min-width: 44px; padding: 7px 8px; margin: -7px -8px; }
    #helpText { display: none; }
  }
  @media (max-width: 360px) { #ph { padding-left: 16px; padding-right: 16px; } #instr { font-size: 25px; } #stage { margin-left: 12px; margin-right: 12px; } #pf { padding-left: 14px; padding-right: 14px; } }
  @media (max-width: 520px) and (max-height: 600px) { #ph { padding-top: 26px; padding-bottom: 12px; } #instr { font-size: 24px; } #stage { margin-top: 10px; margin-bottom: 8px; } #pf { min-height: 58px; padding-top: 8px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); } }
  .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }
  @media (orientation: landscape) and (max-height: 520px) {
    #pop { overflow-y: auto; }
    #ph { padding-top: 14px; padding-bottom: 10px; }
    #instr { font-size: 22px; }
    #stage { margin-top: 8px; margin-bottom: 6px; max-height: 54vh; }
    #pf { min-height: 54px; padding-top: 4px; padding-bottom: 4px; }
  }
  @media (prefers-contrast: more) {
    #stage { border: 2px solid currentColor; box-shadow: none; }
    #bar { opacity: 1; }
    #close, #help { outline: 2px solid currentColor; outline-offset: 2px; }
    #rounds, #instrSmall, #pf { color: CanvasText; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <div id="box" role="button" tabindex="0" data-state="idle" aria-live="polite" aria-label="Start a quick human check">
    <div id="check">
      <span id="spin"></span>
      <svg id="tick" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg id="cross" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      <svg id="excl" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v6M8 12.2v.4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <div id="txt"><span id="label">Verify you are human</span><span id="sub" role="status" aria-live="polite"></span></div>
    <div class="brand"><b><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="#2f6bff" stroke-width="2.2"/><circle cx="19.2" cy="8.6" r="3.2" fill="#f59e0b"/></svg>Axex Orbit</b><small>Secure visual check</small></div>
  </div>

  <div id="pop" role="dialog" aria-modal="true" aria-labelledby="instr" aria-describedby="instrSmall" tabindex="-1" data-tone="blue" data-view="play">
    <div id="ph"><div id="instrSmall" aria-live="polite"></div><div id="instr" aria-live="polite"></div><button id="close" type="button" aria-label="Cancel verification">&times;</button></div>
    <div id="pb"><div id="bar"></div></div>
    <div id="stage" role="group" aria-describedby="stageHelp">
      <span id="stageHelp" class="sr-only">Watch the glow, follow it with your eyes, then tap where it was. If this is difficult, choose Need another way.</span>
      <div id="stageMeta" aria-hidden="true"><i></i><span>LIVE TRACKING</span></div>
      <canvas id="c" aria-hidden="true"></canvas>
      <div id="vf"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#1e9e5a"/><path d="M6.5 12.5l3.7 3.7 7.3-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div id="pf">
      <button id="help" type="button" aria-label="Need another way to verify?"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5M12 16.6v.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span id="helpText">Need another way?</span></button>
      <span id="rounds" role="status" aria-live="polite"></span>
      <div class="brand"><b><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="#2f6bff" stroke-width="2.2"/><circle cx="19.2" cy="8.6" r="3.2" fill="#f59e0b"/></svg>Axex Orbit</b><small>Secure visual check</small></div>
    </div>
  </div>
<script type="module" src="/widget/frame.js"></script>
</body>
</html>
