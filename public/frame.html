<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Axex Orbit</title>
<style>
  :root { color-scheme: dark; --bg:#14161c; --fg:#e8eaf0; --muted:#8b91a1; --accent:#5865f2; --ok:#3ba55d; --bad:#ed4245; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  #wrap { display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px; max-width:420px; margin:0 auto; }
  #status { min-height:20px; font-weight:600; text-align:center; }
  #stage { width:100%; aspect-ratio:360/270; position:relative; touch-action:none; }
  canvas { width:100%; height:100%; border-radius:10px; background:#0d0f14; display:block; touch-action:none; cursor:crosshair; }
  #bar { display:flex; justify-content:space-between; width:100%; align-items:center; color:var(--muted); font-size:12px; }
  button { background:none; border:1px solid #2a2e3a; color:var(--muted); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover { color:var(--fg); }
  #overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; border-radius:10px; background:rgba(13,15,20,.85); font-weight:700; font-size:18px; text-align:center; padding:12px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="status">...</div>
  <div id="stage"><canvas id="c"></canvas><div id="overlay"></div></div>
  <div id="bar"><span id="round"></span><button id="help" type="button"></button></div>
</div>
<script type="module" src="/widget/frame.js"></script>
</body>
</html>
