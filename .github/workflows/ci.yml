name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: orbit-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run testSecurity
      - run: npm run testA11y
      - run: npm run audit
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: orbit-ci
          POSTGRES_DB: orbit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d orbit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          ORBIT_TEST_DATABASE_URL: postgresql://postgres:orbit-ci@localhost:5432/orbit
  container:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t axex-orbit:ci .
      - run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges -e NODE_ENV=production -e ORBIT_SIGNING_KEY=${{ secrets.ORBIT_CI_SIGNING_KEY }} -e ORBIT_SIGNING_KEY_ID=ci -e ORBIT_SITE_SECRET=${{ secrets.ORBIT_CI_SITE_SECRET }} -e ORBIT_PUBLIC_URL=https://orbit.example -e ALLOWED_ORIGINS=https://portal.example -e DATABASE_URL=postgresql://postgres:orbit-ci@host.docker.internal:5432/orbit -p 18787:8787 axex-orbit:ci
